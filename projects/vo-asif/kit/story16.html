// ---------- runtime ----------
let OUT, OG;
function prep() {
  B.forEach(b => b.t0 = b.anchor === 'আপনি কি জানেন প্রাচীনযুগের' ? 0 : T(b.anchor) - 0.12);
  B.sort((a, b) => a.t0 - b.t0);
  B.forEach((b, i) => b.t1 = i < B.length - 1 ? B[i + 1].t0 : DUR);
  window.CUTS = B.slice(1).map(b => +b.t0.toFixed(2));
  window.CHAPTERS = [T('মধ্যপ্রাচ্যের একটি অঞ্চলে'), T('চলুন, সেই প্রাচীন যুগের'), T('ঠিক এই প্রশ্নটির উত্তর খুঁজতেই'), T('§তাহলে এবার সেই বড় প্রশ্নটির'), T('§এবার আসা যাক আমাদের সবশেষ')];
}
function render(i) {
  const t = i / FPS, g = OG;
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1; g.clearRect(0, 0, W, H);
  let bi = B.findIndex(b => t >= b.t0 && t < b.t1); if (bi < 0) bi = B.length - 1;
  const b = B[bi], d = t - b.t0, len = b.t1 - b.t0;
  const whip = bi > 0 ? 1 - easeOut(seg(d, 0, 0.28)) : 0;
  const push = 1 + 0.035 * seg(d, 0, len);
  g.save(); g.translate(W / 2, H / 2); g.scale(push + whip * 0.12, push + whip * 0.12); g.rotate(whip * 0.02 * (bi % 2 ? 1 : -1)); g.translate(-W / 2 + whip * 60 * (bi % 2 ? 1 : -1), -H / 2);
  b.fn(g, t, b);
  g.restore();
